[package]
name = "cor-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Cassidy Prather <pratherea@gmail.com>"]
description = "Cassidy's opinionated Rust template"
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CorVous/CorCode"
keywords = ["cli", "template"]
categories = ["command-line-utilities"]
publish = false
default-run = "cor-code"

[lib]
name = "cor_code"
path = "src/lib.rs"

[[bin]]
name = "cor-code"
path = "src/main.rs"

[[bin]]
name = "gen-docs"
path = "src/bin/gen_docs.rs"

[[bench]]
name = "cli_bench"
harness = false

[dependencies]
anyhow = { version = "1.0.100", default-features = true }
argon2 = "0.5.3"
axum = "0.8.9"
base64 = "0.23.1"
bollard = "0.21.0"
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde", "std"] }
clap = { version = "4.5.53", features = ["derive"] }
env_logger = { version = "0.11.8", default-features = true }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
log = { version = "0.4.28", default-features = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
ulid = "3.0.0"

[dev-dependencies]
argon2 = "0.5.3"
assert_cmd = { version = "2.0.17", default-features = true }
criterion = "0.7.0"
predicates = { version = "3.1.3", default-features = true }
reqwest = { version = "0.13.4", default-features = false, features = ["form"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Turn everything up. I'm not a coward!
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Targeted allows (each one earns its place, like the ruff ignores did)
multiple_crate_versions = "allow" # Transitive deps disagree; not actionable here
missing_errors_doc = "allow" # Undocumented stuff is fine (the D10 of clippy)
missing_panics_doc = "allow" # Ditto

[profile.release]
# Smaller, faster binaries at the cost of compile time
lto = "thin"
strip = "symbols"
