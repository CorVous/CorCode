<!-- PROTOTYPE — throwaway. Three variants of the CorCode MVP web UI (wayfinder ticket #10),
     switchable via the floating bar or ←/→ keys. Hash routes: #/<variant>/<screen>.
     Open this file directly in a browser; no build, no server. -->
<title>CorCode UI Prototype</title>
<style>
  /* ---------- wrapper (not part of the design under evaluation) ---------- */
  :root {
    --wrap-bg: #e8e9ec;
    --wrap-fg: #17181a;
    --pill-bg: #17181a;
    --pill-fg: #f5f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --wrap-bg: #0c0d0f; --wrap-fg: #e8e9ec; --pill-bg: #f5f5f4; --pill-fg: #17181a; }
  }
  :root[data-theme="dark"] { --wrap-bg: #0c0d0f; --wrap-fg: #e8e9ec; --pill-bg: #f5f5f4; --pill-fg: #17181a; }
  :root[data-theme="light"] { --wrap-bg: #e8e9ec; --wrap-fg: #17181a; --pill-bg: #17181a; --pill-fg: #f5f5f4; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--wrap-bg); color: var(--wrap-fg);
    font-family: system-ui, sans-serif;
    min-height: 100vh;
  }
  .phone {
    max-width: 430px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column; position: relative;
    box-shadow: 0 0 0 1px rgb(128 128 128 / .25);
  }
  @media (max-width: 430px) { .phone { box-shadow: none; } }

  .switcher {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    z-index: 99; display: flex; align-items: center; gap: 2px;
    background: var(--pill-bg); color: var(--pill-fg);
    border-radius: 999px; padding: 4px 6px;
    box-shadow: 0 4px 16px rgb(0 0 0 / .35);
    font: 600 13px/1 system-ui, sans-serif;
  }
  .switcher button {
    background: none; border: 0; color: inherit; font: inherit;
    padding: 6px 10px; cursor: pointer; border-radius: 999px;
  }
  .switcher button:hover { background: rgb(128 128 128 / .3); }
  .switcher button:focus-visible { outline: 2px solid currentColor; }
  .switcher .lbl { padding: 0 6px; min-width: 120px; text-align: center; }

  /* ============================================================
     VARIANT A — "Inbox" (messenger idiom)
     ============================================================ */
  .va {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1c2530; --dim: #66707d;
    --line: #e2e7ee; --accent: #2563b0; --accent-ink: #ffffff;
    --live: #2e9e5b; --parked: #c98a1b; --archived: #8b93a0;
    --bubble-me: #2563b0; --bubble-me-ink: #ffffff; --bubble-ag: #e9edf3;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .va { --bg: #12161c; --card: #1b212a; --ink: #e6eaf0; --dim: #8d97a5;
          --line: #2a323d; --accent: #5b96d6; --accent-ink: #0e1319;
          --bubble-me: #2b5c94; --bubble-me-ink: #eaf1f9; --bubble-ag: #232b36; }
  }
  :root[data-theme="dark"] .va { --bg: #12161c; --card: #1b212a; --ink: #e6eaf0; --dim: #8d97a5;
          --line: #2a323d; --accent: #5b96d6; --accent-ink: #0e1319;
          --bubble-me: #2b5c94; --bubble-me-ink: #eaf1f9; --bubble-ag: #232b36; }
  :root[data-theme="light"] .va { --bg: #f4f6f9; --card: #ffffff; --ink: #1c2530; --dim: #66707d;
          --line: #e2e7ee; --accent: #2563b0; --accent-ink: #ffffff;
          --bubble-me: #2563b0; --bubble-me-ink: #ffffff; --bubble-ag: #e9edf3; }

  .va { display: flex; flex-direction: column; flex: 1; }
  .va .top {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px; background: var(--bg);
    position: sticky; top: 0; z-index: 5;
  }
  .va .top h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -.02em; }
  .va .top .sub { font-size: 12px; color: var(--dim); }
  .va .iconbtn {
    width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: var(--accent); color: var(--accent-ink);
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  .va .iconbtn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); font-size: 16px; }
  .va .rows { flex: 1; overflow-y: auto; padding-bottom: 120px; }
  .va .row {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 16px; background: none; border: 0; width: 100%;
    text-align: left; cursor: pointer; font: inherit; color: inherit;
  }
  .va .row + .row { border-top: 1px solid var(--line); }
  .va .row:hover { background: var(--card); }
  .va .avatar {
    width: 44px; height: 44px; border-radius: 14px; flex: none;
    display: grid; place-items: center; font-weight: 700; font-size: 16px;
    background: var(--accent); color: var(--accent-ink); position: relative;
  }
  .va .avatar.alt { background: #7c5bd6; }
  .va .dot {
    position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px;
    border-radius: 50%; border: 2px solid var(--bg);
  }
  .va .dot.live { background: var(--live); }
  .va .dot.parked { background: var(--parked); }
  .va .dot.archived { background: var(--archived); }
  .va .row .mid { flex: 1; min-width: 0; }
  .va .row .name { font-weight: 600; font-size: 15px; }
  .va .row .snippet {
    font-size: 13px; color: var(--dim); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .va .row .meta { text-align: right; font-size: 11px; color: var(--dim); flex: none; }
  .va .row .meta .state { display: block; margin-top: 3px; font-weight: 600; text-transform: capitalize; }
  .va .row .meta .state.live { color: var(--live); }
  .va .row .meta .state.parked { color: var(--parked); }
  .va .section-label {
    padding: 14px 16px 4px; font-size: 11px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
  }
  .va .tabs {
    position: sticky; bottom: 0; display: flex; border-top: 1px solid var(--line);
    background: var(--card); z-index: 5;
  }
  .va .tabs button {
    flex: 1; padding: 10px 0 14px; background: none; border: 0; cursor: pointer;
    font: 600 11px system-ui, sans-serif; color: var(--dim);
  }
  .va .tabs button .ic { display: block; font-size: 20px; margin-bottom: 2px; }
  .va .tabs button.on { color: var(--accent); }

  /* A: chat view */
  .va .chat-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--card); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  .va .chat-head .back { background: none; border: 0; font-size: 22px; color: var(--accent); cursor: pointer; padding: 4px 6px; }
  .va .chat-head .t { flex: 1; min-width: 0; }
  .va .chat-head .t .n { font-weight: 700; font-size: 15px; }
  .va .chat-head .t .b { font-size: 11px; color: var(--dim); font-family: ui-monospace, monospace; }
  .va .chat-head .st { font-size: 11px; font-weight: 700; }
  .va .chat-head .st.live { color: var(--live); }
  .va .chat-head .st.parked { color: var(--parked); }
  .va .chat-head .st.archived { color: var(--archived); }
  .va .msgs { flex: 1; overflow-y: auto; padding: 12px 12px 140px; display: flex; flex-direction: column; gap: 10px; }
  .va .bubble { max-width: 82%; padding: 9px 13px; border-radius: 18px; font-size: 14px; line-height: 1.45; }
  .va .bubble.me { align-self: flex-end; background: var(--bubble-me); color: var(--bubble-me-ink); border-bottom-right-radius: 6px; }
  .va .bubble.agent { align-self: flex-start; background: var(--bubble-ag); border-bottom-left-radius: 6px; }
  .va .chip {
    align-self: flex-start; display: inline-flex; gap: 6px; align-items: center;
    font: 500 12px ui-monospace, monospace; color: var(--dim);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
  }
  .va .sysline { align-self: center; font-size: 11px; color: var(--dim); text-align: center; }
  .va .sysline code { font-family: ui-monospace, monospace; }
  .va .notice {
    align-self: stretch; border: 1px dashed var(--parked); border-radius: 12px;
    padding: 10px 12px; font-size: 12.5px; color: var(--ink); background: color-mix(in srgb, var(--parked) 8%, transparent);
  }
  .va .notice b { color: var(--parked); }
  .va .inputbar {
    position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 12px 14px;
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .va .inputbar input {
    flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 10px 16px; font: 14px system-ui, sans-serif;
  }
  .va .inputbar button {
    border: 0; background: var(--accent); color: var(--accent-ink);
    border-radius: 999px; padding: 0 16px; font-weight: 700; cursor: pointer;
  }
  .va .parkhint { position: sticky; bottom: 62px; margin: 0 12px; text-align: center; font-size: 11.5px; color: var(--parked); }

  /* A: new chat wizard */
  .va .wiz { padding: 16px; display: flex; flex-direction: column; gap: 18px; padding-bottom: 120px; }
  .va .wiz h2 { margin: 0; font-size: 20px; }
  .va .steps { display: flex; gap: 6px; }
  .va .steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .va .steps span.on { background: var(--accent); }
  .va .field label { display: block; font-size: 12px; font-weight: 700; color: var(--dim); margin-bottom: 6px; }
  .va .field input, .va .field select {
    width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 12px; padding: 12px 14px; font: 15px system-ui, sans-serif;
  }
  .va .hint { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .va .hint code { font-family: ui-monospace, monospace; }
  .va .togglerow { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .va .cta {
    border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 14px;
    padding: 14px; font: 700 15px system-ui, sans-serif; cursor: pointer;
  }

  /* A: machines */
  .va .mach { padding: 16px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 120px; }
  .va .mcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .va .mcard .k { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .va .mcard .v { font-size: 15px; margin-top: 4px; }
  .va .mcard .v code { font-family: ui-monospace, monospace; font-size: 13px; }

  /* ============================================================
     VARIANT B — "Console" (ops-log idiom)
     ============================================================ */
  .vb {
    --bg: #f7f6f2; --ink: #24251f; --dim: #7b7b70; --line: #dedcd2;
    --accent: #a8530e; --live: #3d7a2f; --parked: #a8760e; --err: #b3362a;
    --strip: #eceade;
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  @media (prefers-color-scheme: dark) {
    .vb { --bg: #101210; --ink: #d9dbd2; --dim: #7d8177; --line: #262a24;
          --accent: #e08a45; --live: #7bc266; --parked: #d4a545; --err: #e06a5e;
          --strip: #161a15; }
  }
  :root[data-theme="dark"] .vb { --bg: #101210; --ink: #d9dbd2; --dim: #7d8177; --line: #262a24;
          --accent: #e08a45; --live: #7bc266; --parked: #d4a545; --err: #e06a5e; --strip: #161a15; }
  :root[data-theme="light"] .vb { --bg: #f7f6f2; --ink: #24251f; --dim: #7b7b70; --line: #dedcd2;
          --accent: #a8530e; --live: #3d7a2f; --parked: #a8760e; --err: #b3362a; --strip: #eceade; }

  .vb { display: flex; flex-direction: column; flex: 1; }
  .vb .strip {
    position: sticky; top: 0; z-index: 5;
    background: var(--strip); border-bottom: 1px solid var(--line);
    padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 14px;
    font-size: 11.5px; cursor: pointer;
  }
  .vb .strip .item b { font-weight: 700; }
  .vb .strip .ok { color: var(--live); }
  .vb .strip .warn { color: var(--parked); }
  .vb .strippanel { background: var(--strip); border-bottom: 1px solid var(--line); padding: 10px 12px; font-size: 12px; }
  .vb .strippanel table { border-collapse: collapse; width: 100%; }
  .vb .strippanel td { padding: 3px 8px 3px 0; vertical-align: top; }
  .vb .strippanel td:first-child { color: var(--dim); white-space: nowrap; }
  .vb .list { flex: 1; overflow-y: auto; padding-bottom: 120px; }
  .vb .grp { padding: 12px 12px 2px; color: var(--dim); font-size: 11px; letter-spacing: .1em; }
  .vb .grp .cnt { color: var(--ink); }
  .vb .crow {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--line); padding: 8px 12px; cursor: pointer;
    font: inherit; color: inherit;
  }
  .vb .crow:hover { background: var(--strip); }
  .vb .crow .l1 { display: flex; gap: 8px; align-items: baseline; }
  .vb .crow .st { font-weight: 700; width: 12px; flex: none; }
  .vb .crow .st.live { color: var(--live); }
  .vb .crow .st.parked { color: var(--parked); }
  .vb .crow .st.archived { color: var(--dim); }
  .vb .crow .nm { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vb .crow .tm { color: var(--dim); font-size: 11px; flex: none; }
  .vb .crow .l2 { color: var(--dim); font-size: 11.5px; margin-top: 2px; padding-left: 20px;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vb .newbar {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--line);
    padding: 10px 12px; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer;
  }
  .vb .newform { border-bottom: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--strip); }
  .vb .newform .fr { display: flex; gap: 8px; align-items: center; }
  .vb .newform label { color: var(--dim); width: 78px; flex: none; font-size: 11.5px; }
  .vb .newform input, .vb .newform select {
    flex: 1; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    padding: 6px 8px; font: 12.5px ui-monospace, monospace; border-radius: 3px; min-width: 0;
  }
  .vb .newform .go { align-self: flex-start; background: var(--accent); color: var(--bg); border: 0; padding: 7px 14px; font: 700 12.5px ui-monospace, monospace; cursor: pointer; border-radius: 3px; }
  .vb .newform .note { color: var(--dim); font-size: 11px; }

  /* B: log view */
  .vb .loghead {
    position: sticky; top: 0; z-index: 5; background: var(--strip); border-bottom: 1px solid var(--line);
    padding: 8px 12px; display: flex; gap: 10px; align-items: baseline;
  }
  .vb .loghead .back { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 0; }
  .vb .loghead .nm { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vb .loghead .st { font-size: 11px; font-weight: 700; }
  .vb .loghead .st.live { color: var(--live); } .vb .loghead .st.parked { color: var(--parked); } .vb .loghead .st.archived { color: var(--dim); }
  .vb .logmeta { border-bottom: 1px solid var(--line); padding: 6px 12px; color: var(--dim); font-size: 11px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .vb .log { flex: 1; overflow-y: auto; padding: 8px 0 150px; }
  .vb .ev { padding: 3px 12px; display: flex; gap: 8px; line-height: 1.5; }
  .vb .ev:hover { background: var(--strip); }
  .vb .ev .ts { color: var(--dim); font-size: 10.5px; flex: none; width: 40px; padding-top: 2px; }
  .vb .ev .pf { flex: none; width: 14px; font-weight: 700; }
  .vb .ev.user .pf { color: var(--accent); }
  .vb .ev.agent .pf { color: var(--dim); }
  .vb .ev.tool .pf, .vb .ev.tool .tx { color: var(--dim); font-size: 12px; }
  .vb .ev.git .pf, .vb .ev.git .tx { color: var(--live); font-size: 12px; }
  .vb .ev.notice { border-left: 3px solid var(--parked); margin: 4px 12px; padding: 6px 9px; background: var(--strip); display: block; font-size: 12px; }
  .vb .ev.notice .hd { color: var(--parked); font-weight: 700; }
  .vb .ev .tx { min-width: 0; white-space: pre-wrap; word-break: break-word; }
  .vb .cmdline {
    position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center;
    background: var(--strip); border-top: 1px solid var(--line); padding: 10px 12px 14px;
  }
  .vb .cmdline .pr { color: var(--accent); font-weight: 700; }
  .vb .cmdline input { flex: 1; background: none; border: 0; color: var(--ink); font: 13px ui-monospace, monospace; outline: none; }
  .vb .cmdline .hint { position: absolute; top: -20px; left: 12px; right: 12px; font-size: 10.5px; color: var(--parked); }

  /* ============================================================
     VARIANT C — "Workbench" (git-forward cards)
     ============================================================ */
  .vc {
    --bg: #eef0ee; --card: #ffffff; --ink: #1d221f; --dim: #6b736e;
    --line: #dbdfdb; --accent: #22694a; --accent-ink: #ffffff;
    --live: #22694a; --parked: #9a6d13; --archived: #79817b; --rail: #c9cfc9;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .vc { --bg: #14171a; --card: #1d2126; --ink: #e2e6e3; --dim: #8e968f;
          --line: #2c3138; --accent: #4fa87c; --accent-ink: #0e1512;
          --live: #4fa87c; --parked: #cfa14a; --archived: #79817b; --rail: #3a4148; }
  }
  :root[data-theme="dark"] .vc { --bg: #14171a; --card: #1d2126; --ink: #e2e6e3; --dim: #8e968f;
          --line: #2c3138; --accent: #4fa87c; --accent-ink: #0e1512;
          --live: #4fa87c; --parked: #cfa14a; --archived: #79817b; --rail: #3a4148; }
  :root[data-theme="light"] .vc { --bg: #eef0ee; --card: #ffffff; --ink: #1d221f; --dim: #6b736e;
          --line: #dbdfdb; --accent: #22694a; --accent-ink: #ffffff;
          --live: #22694a; --parked: #9a6d13; --archived: #79817b; --rail: #c9cfc9; }

  .vc { display: flex; flex-direction: column; flex: 1; }
  .vc .hd { padding: 16px 16px 8px; display: flex; align-items: baseline; gap: 10px;
            position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .vc .hd h1 { margin: 0; font-size: 17px; letter-spacing: -.01em; flex: 1; }
  .vc .hd .navlink { background: none; border: 0; color: var(--dim); font: 600 12px system-ui, sans-serif; cursor: pointer; padding: 4px; }
  .vc .hd .navlink.on { color: var(--accent); }
  .vc .cap { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .vc .cards { flex: 1; overflow-y: auto; padding: 8px 12px 130px; display: flex; flex-direction: column; gap: 10px; }
  .vc .ccard {
    width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .vc .ccard:hover { border-color: var(--accent); }
  .vc .ccard .r1 { display: flex; align-items: center; gap: 8px; }
  .vc .ccard .nm { font-weight: 650; font-size: 14.5px; flex: 1; min-width: 0; }
  .vc .pill {
    font: 700 10px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase;
    border-radius: 4px; padding: 3px 7px; flex: none;
  }
  .vc .pill.live { background: color-mix(in srgb, var(--live) 15%, transparent); color: var(--live); }
  .vc .pill.parked { background: color-mix(in srgb, var(--parked) 15%, transparent); color: var(--parked); }
  .vc .pill.archived { background: color-mix(in srgb, var(--archived) 18%, transparent); color: var(--archived); }
  .vc .gitline {
    display: flex; gap: 8px; align-items: center; font: 11.5px ui-monospace, monospace;
    color: var(--dim); overflow: hidden; white-space: nowrap;
  }
  .vc .gitline .br { color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
  .vc .ccard .last { font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vc .ccard .last b { color: var(--ink); font-weight: 600; }
  .vc .fab {
    position: fixed; right: max(16px, calc(50% - 199px)); bottom: 64px; z-index: 50;
    width: 52px; height: 52px; border-radius: 16px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-size: 26px; line-height: 1;
    box-shadow: 0 6px 18px rgb(0 0 0 / .25);
  }

  /* C: chat view */

  if (screen === "new") return renderCNew();
  if (screen === "mach") return `<div class="vc">
    ${cHead("mach")}
    <div class="mgrid">
      <div class="mtile"><span class="cap">Pool</span><div class="big">2 / 2</div><div class="sub">warm slots in use</div></div>
      <div class="mtile"><span class="cap">Parked</span><div class="big">${MACHINES.parked}</div><div class="sub">workspace kept, no container</div></div>
      <div class="mtile wide"><span class="cap">Containers</span>
        ${MACHINES.pool.map(p => `<div class="slot"><span class="who">${esc(p.chat)}</span><span class="up">up ${p.up} · idle ${p.idle}</span></div>`).join("")}
        <div class="sub" style="margin-top:8px">Oldest idle parks when a third chat needs a slot.</div></div>
      <div class="mtile wide"><span class="cap">Workspace image</span><div class="sub" style="margin-top:6px"><code>${MACHINES.image}</code> — pinned; built on-box; new tag activates via config</div></div>
      <div class="mtile wide"><span class="cap">Orphan sweep</span><div class="sub" style="margin-top:6px">${MACHINES.sweep} · host <code>${MACHINES.host}</code></div></div>
    </div>
  </div>`;

  const card = c => `<button class="ccard" onclick="go('c','chat','${c.id}')">
      <span class="r1"><span class="nm">${esc(c.name)}</span><span class="pill ${c.state}">${stateWord[c.state]}</span></span>
      <span class="gitline"><span>⎇</span><span class="br">${esc(c.branch)}</span><span>· push ${c.lastPush}</span></span>
      <span class="last"><b>${esc(c.lastCommit.split(" ")[0])}</b> ${esc(c.lastCommit.split(" ").slice(1).join(" "))}</span>
    </button>`;
  return `<div class="vc">
    ${cHead("list")}
    <div class="cards">
      <span class="cap">Open — 2 live · 2 parked</span>
      ${CHATS.filter(c => c.state !== "archived").map(card).join("")}
      <span class="cap" style="margin-top:8px">Archived</span>
      ${CHATS.filter(c => c.state === "archived").map(card).join("")}
    </div>
    <button class="fab" onclick="go('c','new')" aria-label="New chat">+</button>
  </div>`;
}
function renderCChat(id) {
  const c = CHATS.find(x => x.id === id) || CHATS[0];
  const evs = EVENTS[c.id] || EVENTS.c1;
  const item = e => {
    if (e.k === "notice") return `<div class="tl-item"><div class="tl-rail"><span class="nd" style="background:var(--parked)"></span><span class="ln"></span></div>
      <div class="tl-body"><div class="notice"><div class="hd2">Reset notice</div>${esc(e.tx)}</div></div></div>`;
    if (e.k === "tool") return `<div class="tl-item tool"><div class="tl-rail"><span class="nd"></span><span class="ln"></span></div>
      <div class="tl-body"><details class="tool"><summary>${esc(e.tx)}</summary><div class="body">${esc(e.detail || "")}</div></details></div></div>`;
    if (e.k === "git") return `<div class="tl-item git"><div class="tl-rail"><span class="nd"></span><span class="ln"></span></div>
      <div class="tl-body"><div class="tl-tx">${esc(e.tx)}</div></div></div>`;
    return `<div class="tl-item ${e.k}"><div class="tl-rail"><span class="nd"></span><span class="ln"></span></div>
      <div class="tl-body"><div class="tl-who">${e.k === "user" ? "You" : "Agent"} · ${e.ts}</div><div class="tl-tx">${esc(e.tx)}</div></div></div>`;
  };
  const archived = c.state === "archived", parked = c.state === "parked";
  return `<div class="vc">
    <div class="cv-head">
      <div class="r"><button class="back" onclick="go('c','list')" aria-label="Back">‹</button>
        <span class="nm">${esc(c.name)}</span><span class="pill ${c.state}">${stateWord[c.state]}</span></div>
      <div class="gitbar">
        <span>⎇ <span class="b">${esc(c.branch)}</span></span>
        <span class="ok">✓ pushed ${c.lastPush}</span>
        <span>${c.state === "live" ? `container up ${c.up}` : c.state === "parked" ? `<span class="warn">no container — resumes on prompt</span>` : `<span class="warn">workspace deleted — revives on prompt</span>`}</span>
      </div>
    </div>
    <div class="tl">${evs.map(item).join("")}</div>
    <div class="actions">
      <button>Park now</button><button>Archive — push-gated</button>
    </div>
    <div class="composer">
      ${parked ? `<div class="resume">Prompt will re-spin the container and run the reconnect ladder.</div>` : ""}
      ${archived ? `<div class="resume">Prompt revives: fresh clone at last pushed commit + reset notice to the agent.</div>` : ""}
      <div class="rowi"><input placeholder="Prompt the agent…" aria-label="Prompt"><button class="send">Send</button></div>
    </div>
  </div>`;
}
function renderCNew() {
  return `<div class="vc">
    <div class="cv-head"><div class="r"><button class="back" onclick="go('c','list')" aria-label="Back">‹</button>
      <span class="nm">New chat</span></div></div>
    <div class="sheet">
      <div class="f"><label>Repository</label><select><option>CorVous/CorCode</option><option>CorVous/zenni-tools</option></select></div>
      <div class="f"><label>Base branch</label><select><option>main</option><option>develop</option></select></div>
      <div class="f"><label>Title</label><input id="c-slug" placeholder="Resume ladder polish" oninput="cSlug(this.value)"></div>
      <div class="f"><label>Chat branch</label><div class="brpreview" id="c-br">chat/2026-08-05-…</div></div>
      <label class="optout"><input type="checkbox">
        <span>Work directly on the base branch<div class="note">Skips the chat branch; commits land straight on main.</div></span></label>
      <button class="go">Create — fresh clone, container from ${MACHINES.image}</button>
    </div>
  </div>`;
}
function cSlug(v) {
  const s = v.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "…";
  const el = document.getElementById("c-br");
  if (el) el.textContent = "chat/2026-08-05-" + s;
}

/* ------------------------------------------------------------------ */
/* VARIANT D — Unstyled                                                */
/* ------------------------------------------------------------------ */
function renderD({ screen, id }) {
  if (screen === "chat" && id) return renderDChat(id);

  const summary = `pool 2/2 · parked ${MACHINES.parked} · img ${MACHINES.image.split(":")[1]} · sweep ok`;
  const live = CHATS.filter(c => c.state === "live");
  const parked = CHATS.filter(c => c.state === "parked");
  const archived = CHATS.filter(c => c.state === "archived");
  const list = cs => `<ul>${cs.map(c => `<li><a href="#/d/chat/${c.id}">${esc(c.name)}</a><br><small>${esc(c.branch)} · push ${esc(c.lastPush)}</small></li>`).join("")}</ul>`;
  return `<div class="vd">
    <details ${screen === "machines" ? "open" : ""}>
      <summary>${summary}</summary>
      <dl>
        <dt>Pool</dt>
        <dd>${MACHINES.pool.map(p => `${esc(p.chat)} — up ${p.up}, idle ${p.idle}`).join("<br>")}</dd>
        <dt>Parked</dt>
        <dd>${MACHINES.parked} chats — workspace kept, container torn down</dd>
        <dt>Image</dt>
        <dd>${esc(MACHINES.image)}</dd>
        <dt>Sweep</dt>
        <dd>${esc(MACHINES.sweep)}</dd>
        <dt>Host</dt>
        <dd>${esc(MACHINES.host)}</dd>
      </dl>
    </details>
    <details ${screen === "new" ? "open" : ""}>
      <summary>New chat</summary>
      <form onsubmit="return false">
        <div><label>Repository <select><option>CorVous/CorCode</option><option>CorVous/zenni-tools</option></select></label></div>
        <div><label>Base branch <select><option>main</option><option>develop</option></select></label></div>
        <div><label>Slug <input id="d-slug" placeholder="resume-ladder" oninput="dSlug(this.value)"></label></div>
        <p>Branch: <span id="d-br">chat/2026-08-05-…</span></p>
        <label><input type="checkbox"> work directly on base branch</label>
        <p><button>Create</button></p>
      </form>
    </details>
    <h3>Live</h3>
    ${list(live)}
    <h3>Parked</h3>
    ${list(parked)}
    <h3>Archived</h3>
    ${list(archived)}
  </div>`;
}
function dSlug(v) {
  const el = document.getElementById("d-br");
  if (el) el.textContent = "chat/2026-08-05-" + v.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-");
}
function renderDChat(id) {
  const c = CHATS.find(x => x.id === id) || CHATS[0];
  const evs = EVENTS[c.id] || EVENTS.c1;
  const body = evs.map(e => {
    if (e.k === "user") return `<p><b>you:</b> ${esc(e.tx)}</p>`;
    if (e.k === "agent") return `<p>${esc(e.tx)}</p>`;
    if (e.k === "tool") return `<p><small>⚙ ${esc(e.tx)}${e.detail ? ` (${esc(e.detail)})` : ""}</small></p>`;
    if (e.k === "git") return `<p><small>✓ ${esc(e.tx)}</small></p>`;
    if (e.k === "notice") return `<blockquote><b>reset notice:</b> ${esc(e.tx)}</blockquote>`;
  }).join("");
  const parked = c.state === "parked";
  const archived = c.state === "archived";
  return `<div class="vd">
    <p><a href="#/d/list">← chats</a></p>
    <h3>${esc(c.name)}</h3>
    <p><small>${esc(c.repo)} · ${esc(c.branch)} · push ${esc(c.lastPush)} · ${stateWord[c.state]}</small></p>
    ${body}
    ${parked ? `<p><small>prompt re-spins the container</small></p>` : ""}
    ${archived ? `<p><small>prompt revives: fresh clone at last pushed commit</small></p>` : ""}
    <form onsubmit="return false"><input placeholder="prompt" aria-label="Prompt"> <button>Send</button></form>
  </div>`;
}

/* ------------------------------------------------------------------ */
/* switcher + boot                                                     */
/* ------------------------------------------------------------------ */
const RENDER = { a: renderA, b: renderB, c: renderC, d: renderD };
function paint() {
  const r = route();
  app.innerHTML = RENDER[r.v](r);
  document.getElementById("sw-lbl").textContent = VARIANTS.find(x => x.key === r.v).name;
}
function cycle(dir) {
  const r = route();
  const i = VARIANTS.findIndex(x => x.key === r.v);
  const next = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key;
  go(next, r.screen, r.id);
}
document.getElementById("sw-prev").onclick = () => cycle(-1);
document.getElementById("sw-next").onclick = () => cycle(1);
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
window.addEventListener("hashchange", paint);
paint();
</script>
