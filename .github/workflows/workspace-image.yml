name: Workspace image

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/workspace/**'
      - '.github/workflows/workspace-image.yml'
  pull_request:
    paths:
      - 'docker/workspace/**'
      - '.github/workflows/workspace-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/corvous/corcode-workspace

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Test the stop hook
        run: bash docker/workspace/tests/stop-hook.test.sh

      - name: Build the image
        run: docker build --tag "$IMAGE:candidate" docker/workspace

      - name: Complete an ACP initialize handshake
        run: |
          docker run --rm \
            --volume "$PWD/docker/workspace/smoke.sh:/smoke.sh:ro" \
            "$IMAGE:candidate" bash /smoke.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the date tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          date_tag="$(date --utc +%Y-%m-%d)"
          for tag in "$date_tag" latest; do
            docker tag "$IMAGE:candidate" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "Pushed $IMAGE:$date_tag" >> "$GITHUB_STEP_SUMMARY"
