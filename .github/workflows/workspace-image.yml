name: Workspace image

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/workspace/**'
      - '.github/workflows/workspace-image.yml'
  pull_request:
    paths:
      - 'docker/workspace/**'
      - '.github/workflows/workspace-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/corvous/corcode-workspace

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Test the stop hook
        run: bash docker/workspace/tests/stop-hook.test.sh

      - name: Build the image
        run: docker build --tag "$IMAGE:candidate" docker/workspace

      - name: Complete an ACP initialize handshake
        run: |
          docker run --rm \
            --volume "$PWD/docker/workspace/smoke.sh:/smoke.sh:ro" \
            "$IMAGE:candidate" bash /smoke.sh

      - name: Exercise the toolchains under the runtime's hardened flags
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          chmod 0777 "$scratch"
          docker run --rm \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m \
            --volume "$scratch:/workspace" \
            --volume "$PWD/docker/workspace/tests:/tests:ro" \
            "$IMAGE:candidate" bash /tests/toolchain-cache.sh

      - name: Resolve the baked settings to auto mode
        run: |
          docker run --rm \
            --volume "$PWD/docker/workspace/tests:/opt/corcode-agent/tests:ro" \
            "$IMAGE:candidate" node /opt/corcode-agent/tests/permission-mode.test.mjs

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the date tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          date_tag="$(date --utc +%Y-%m-%d)"
          docker tag "$IMAGE:candidate" "$IMAGE:$date_tag"
          docker push "$IMAGE:$date_tag"
          echo "Pushed $IMAGE:$date_tag" >> "$GITHUB_STEP_SUMMARY"
